services:
  # ── Redis Cache ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine          # Lightweight official Redis image (~30MB)
    container_name: chiranjeevi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data           # Persist cache across container restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-net
    restart: unless-stopped

  # ── FastAPI Backend ───────────────────────────────────────────────────
  fastapi2:
    build:
      context: ./fastapi2
    ports:
      - "8000:8000"
    environment:
      RADAR_PORT: ${RADAR_PORT:-COM7}
      ESP32_PORT: ${ESP32_PORT:-COM6}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      REDIS_URL: redis://redis:6379/0   # Points to the redis service above
    volumes:
      - ./fastapi2:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy   # Wait for Redis to be ready before starting
    networks:
      - app-net

  # ── Node.js Backend ───────────────────────────────────────────────────
  node-backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/usr/src/app
      - node_backend_node_modules:/usr/src/app/node_modules
    command: npm run dev
    networks:
      - app-net

  # ── Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
      - frontend_next_cache:/usr/src/app/.next
    command: npm run dev -- -H 0.0.0.0 -p 3000
    networks:
      - app-net

volumes:
  redis_data:                      # Redis persistence volume
  node_backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:

networks:
  app-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
